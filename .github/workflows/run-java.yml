name: Run Java Program and Tests

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run JUnit tests
        run: mvn test

      - name: Compile program
        run: mvn compile

      - name: Run ScoreCalculator
        run: java -cp target/classes com.diaz2211.ScoreCalculator
